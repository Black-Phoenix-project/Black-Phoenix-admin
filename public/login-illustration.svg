<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" fill="none">
  <!-- Background circle -->
  <circle cx="160" cy="180" r="140" fill="#FACC15" fill-opacity="0.12"/>
  <circle cx="160" cy="180" r="105" fill="#FACC15" fill-opacity="0.08"/>

  <!-- Hard hat -->
  <ellipse cx="160" cy="128" rx="52" ry="14" fill="#FACC15" fill-opacity="0.3"/>
  <path d="M112 130 C112 88 135 64 160 64 C185 64 208 88 208 130 Z" fill="#FACC15"/>
  <rect x="106" y="126" width="108" height="10" rx="5" fill="#EAB308"/>
  <path d="M140 68 L140 62 C140 56 148 52 160 52 C172 52 180 56 180 62 L180 68" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Head / face (abstract — no real features) -->
  <ellipse cx="160" cy="158" rx="32" ry="36" fill="#D4A574" fill-opacity="0.9"/>
  <!-- Visor / safety glasses -->
  <rect x="133" y="148" width="54" height="14" rx="7" fill="#1F2937" fill-opacity="0.85"/>
  <rect x="136" y="150" width="20" height="10" rx="5" fill="#374151" fill-opacity="0.6"/>
  <rect x="164" y="150" width="20" height="10" rx="5" fill="#374151" fill-opacity="0.6"/>
  <line x1="156" y1="155" x2="164" y2="155" stroke="#FACC15" stroke-width="2"/>

  <!-- Body / safety vest -->
  <path d="M118 195 C118 190 130 182 160 182 C190 182 202 190 202 195 L210 280 C210 290 195 298 160 298 C125 298 110 290 110 280 Z" fill="#FACC15"/>
  <!-- Vest reflective stripes -->
  <rect x="128" y="210" width="64" height="5" rx="2.5" fill="#F59E0B" fill-opacity="0.6"/>
  <rect x="125" y="240" width="70" height="5" rx="2.5" fill="#F59E0B" fill-opacity="0.6"/>
  <!-- Vest center line -->
  <line x1="160" y1="190" x2="160" y2="280" stroke="#EAB308" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Left arm -->
  <path d="M118 200 C100 210 88 230 86 250" stroke="#D4A574" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Left glove -->
  <circle cx="84" cy="256" r="10" fill="#FACC15"/>
  <rect x="74" y="252" width="20" height="10" rx="5" fill="#EAB308"/>

  <!-- Right arm -->
  <path d="M202 200 C220 210 232 230 234 250" stroke="#D4A574" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Right glove -->
  <circle cx="236" cy="256" r="10" fill="#FACC15"/>
  <rect x="226" y="252" width="20" height="10" rx="5" fill="#EAB308"/>

  <!-- Tool / clipboard in right hand -->
  <rect x="232" y="238" width="24" height="30" rx="3" fill="#F8F8F6" fill-opacity="0.9"/>
  <line x1="238" y1="246" x2="250" y2="246" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="238" y1="252" x2="248" y2="252" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="238" y1="258" x2="250" y2="258" stroke="#D1D5DB" stroke-width="1.5"/>
  <polyline points="240,264 243,268 250,258" stroke="#22C55E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating gear icon (top right) -->
  <g transform="translate(245, 95) scale(0.7)" opacity="0.3">
    <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#FACC15"/>
    <path d="M11 1h2v3h-2zM11 14h2v3h-2zM3.5 3.5l1.4 1.4 2.1-2.1-1.4-1.4zM13 11.5l1.4 1.4 2.1-2.1-1.4-1.4zM1 8h3v2H1zM14 8h3v2h-3zM3.5 12.5l1.4-1.4 2.1 2.1-1.4 1.4zM13 4.5l1.4-1.4 2.1 2.1-1.4 1.4z" fill="#FACC15"/>
  </g>

  <!-- Floating shield icon (top left) -->
  <g transform="translate(42, 85) scale(0.6)" opacity="0.25">
    <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="#FACC15"/>
    <polyline points="9,12 11,14 15,10" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dotted accent circles -->
  <circle cx="60" cy="300" r="3" fill="#FACC15" fill-opacity="0.2"/>
  <circle cx="72" cy="308" r="2" fill="#FACC15" fill-opacity="0.15"/>
  <circle cx="260" cy="310" r="3" fill="#FACC15" fill-opacity="0.2"/>
  <circle cx="248" cy="318" r="2" fill="#FACC15" fill-opacity="0.15"/>
</svg>
